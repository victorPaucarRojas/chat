<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat en Tiempo Real</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Pusher JS -->
  <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>

  <style>
    body {
      background-color: #f5f7fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .chat-card {
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      height: 520px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.12);
      border-radius: 12px;
      background: white;
    }

    .chat-header {
      padding: 1.5rem;
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      color: #2c3e50;
      border-bottom: 1px solid #e4e9f0;
      user-select: none;
    }

    #messages {
      flex-grow: 1;
      padding: 1.5rem 2rem;
      background-color: #f9fafc;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      border-bottom: 1px solid #e4e9f0;
      scrollbar-width: thin;
      scrollbar-color: #b0b7c3 transparent;
    }

    /* Scrollbar Chrome, Edge, Safari */
    #messages::-webkit-scrollbar {
      width: 8px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      background-color: #b0b7c3;
      border-radius: 4px;
    }

    .message {
      max-width: 70%;
      padding: 0.75rem 1.25rem;
      border-radius: 20px;
      font-size: 1rem;
      line-height: 1.4;
      word-wrap: break-word;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: background-color 0.3s ease;
    }

    .message.sent {
      align-self: flex-end;
      background-color: #4caf50;
      color: white;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(76,175,80,0.3);
    }

    .message:not(.sent) {
      align-self: flex-start;
      background-color: #e3e8ee;
      color: #34495e;
      border-bottom-left-radius: 4px;
    }

    .chat-footer {
      padding: 1rem 1.5rem;
      display: flex;
      gap: 1rem;
      background-color: #fff;
      border-top: 1px solid #e4e9f0;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    #input-message {
      flex-grow: 1;
      padding: 0.75rem 1rem;
      border-radius: 30px;
      border: 1.5px solid #ced4da;
      font-size: 1rem;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    #input-message:focus {
      outline: none;
      border-color: #4caf50;
      box-shadow: 0 0 8px rgba(76, 175, 80, 0.5);
    }
  </style>
</head>
<body>
  <div class="chat-card">
    <div class="chat-header">
      Chat en Tiempo Real
    </div>

    <div id="messages" aria-live="polite" aria-atomic="false"></div>

    <div class="chat-footer">
      <input
        type="text"
        id="input-message"
        class="form-control"
        placeholder="Escribe un mensaje y presiona Enter..."
        aria-label="Mensaje"
        autocomplete="off"
        spellcheck="false"
      />
    </div>
  </div>

  <script>
    // Inicializar Pusher
    Pusher.logToConsole = false; // Desactiva en producción
    var pusher = new Pusher('92e747b6f7fc4ccfa198', {
      cluster: 'us2'
    });

    const channel = pusher.subscribe('my-channel');

    channel.bind('my-event', function (data) {
      addMessage(data.message || "Mensaje vacío", false);
    });

    const input = document.getElementById('input-message');

    input.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        const message = input.value.trim();
        if (message !== '') {
          // Mostrar mensaje localmente como enviado
          addMessage(message, true);

          // Enviar al backend
          fetch('https://your-server.com/send-message', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ message: message })
          }).catch(err => console.error('Error al enviar mensaje:', err));

          input.value = '';
        }
      }
    });

    function addMessage(text, isSender = false) {
      const messageContainer = document.getElementById('messages');
      const msg = document.createElement('div');
      msg.className = 'message' + (isSender ? ' sent' : '');
      msg.textContent = text;
      messageContainer.appendChild(msg);
      messageContainer.scrollTop = messageContainer.scrollHeight;
    }
  </script>
</body>
</html>
