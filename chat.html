<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat en Tiempo Real Profesional</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Pusher -->
  <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>

  <style>
    /* Reset y fuentes */
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f7fa;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 1rem;
    }

    .chat-container {
      background: #fff;
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgb(0 0 0 / 0.1);
      display: flex;
      flex-direction: column;
      height: 500px;
    }

    .chat-header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #e1e5eb;
      text-align: center;
      font-weight: 600;
      font-size: 1.5rem;
      color: #2c3e50;
      user-select: none;
    }

    #messages {
      flex-grow: 1;
      padding: 1.5rem 2rem;
      overflow-y: auto;
      background: #f9fafb;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scrollbar-width: thin;
      scrollbar-color: #bbb transparent;
    }

    /* Scrollbar para Chrome, Edge y Safari */
    #messages::-webkit-scrollbar {
      width: 8px;
    }
    #messages::-webkit-scrollbar-track {
      background: transparent;
    }
    #messages::-webkit-scrollbar-thumb {
      background-color: #bbb;
      border-radius: 4px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    .message {
      max-width: 70%;
      padding: 0.75rem 1rem;
      border-radius: 20px;
      font-size: 1rem;
      line-height: 1.4;
      box-shadow: 0 2px 6px rgb(0 0 0 / 0.08);
      word-wrap: break-word;
      transition: background-color 0.3s ease;
    }

    .sent {
      align-self: flex-end;
      background: #4caf50;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .received {
      align-self: flex-start;
      background: #e3e8ee;
      color: #2c3e50;
      border-bottom-left-radius: 4px;
    }

    .chat-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid #e1e5eb;
      display: flex;
      gap: 0.75rem;
    }

    #input-message {
      flex-grow: 1;
      border-radius: 30px;
      border: 1px solid #d1d5db;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }

    #input-message:focus {
      outline: none;
      border-color: #4caf50;
      box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
    }

    #send-btn {
      background-color: #4caf50;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    #send-btn:hover {
      background-color: #388e3c;
    }

    #send-btn svg {
      fill: white;
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>

  <div class="chat-container shadow">
    <div class="chat-header">
      Chat en Tiempo Real
    </div>
    <div id="messages" aria-live="polite" aria-atomic="false"></div>
    <div class="chat-footer">
      <input
        type="text"
        id="input-message"
        placeholder="Escribe un mensaje y presiona Enter..."
        aria-label="Mensaje"
        autocomplete="off"
      />
      <button id="send-btn" aria-label="Enviar mensaje" title="Enviar mensaje">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    // Inicializar Pusher
    Pusher.logToConsole = false; // Desactivar para producción
    var pusher = new Pusher('92e747b6f7fc4ccfa198', {
      cluster: 'us2'
    });

    const channel = pusher.subscribe('my-channel');
    channel.bind('my-event', function(data) {
      addMessage(data.message, "received");
    });

    const input = document.getElementById('input-message');
    const sendBtn = document.getElementById('send-btn');

    function sendMessage() {
      const message = input.value.trim();
      if (message === '') return;

      addMessage(message, "sent");

      // Simulación de auto-recepción
      setTimeout(() => {
        addMessage("Tú mismo: " + message, "received");
      }, 500);

      input.value = '';
      input.focus();
    }

    input.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    function addMessage(text, type) {
      const messageContainer = document.getElementById('messages');
      const msg = document.createElement('div');
      msg.className = 'message ' + type;
      msg.textContent = text;
      messageContainer.appendChild(msg);
      messageContainer.scrollTop = messageContainer.scrollHeight;
    }
  </script>

</body>
</html>
